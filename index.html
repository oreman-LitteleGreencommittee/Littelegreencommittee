<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFビューアー</title>
<style>
  :root {
    --bg: #1c1d1f;
    --panel: #242527;
    --panel-border: #35363a;
    --ink: #e9e8e4;
    --ink-dim: #9a9a96;
    --accent: #d8b26a;
    --accent-dim: #6b5a38;
    --canvas-bg: #0f0f10;
    --danger: #c96a5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* --- Top bar --- */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;
    margin-right: 4px;
  }
  .brand b { color: var(--accent); font-weight: 600; }

  .file-picker {
    display: inline-flex;
  }
  .file-picker input { display: none; }
  .btn {
    appearance: none;
    border: 1px solid var(--panel-border);
    background: #2b2c2f;
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent-dim); background: #313235; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent);
    color: #221c0f;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.06); }

  .divider { width: 1px; height: 22px; background: var(--panel-border); }

  .nav-group, .zoom-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .page-input {
    width: 46px;
    text-align: center;
    background: #17181a;
    border: 1px solid var(--panel-border);
    color: var(--ink);
    border-radius: 5px;
    padding: 6px 4px;
    font-size: 13.5px;
  }
  .page-total { color: var(--ink-dim); font-size: 13.5px; white-space: nowrap; }
  .zoom-label {
    min-width: 46px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  .filename {
    color: var(--ink-dim);
    font-size: 13px;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* --- Viewer body --- */
  main {
    flex: 1;
    overflow: auto;
    background: var(--canvas-bg);
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  #emptyState {
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    max-width: 360px;
  }
  #emptyState .icon {
    font-size: 40px;
    margin-bottom: 14px;
    opacity: 0.7;
  }
  #emptyState h2 {
    color: var(--ink);
    font-weight: 500;
    font-size: 18px;
    margin: 0 0 8px;
  }
  #emptyState p { font-size: 13.5px; line-height: 1.7; margin: 0; }
  #dropHint {
    margin-top: 22px;
    display: inline-block;
    border: 1px dashed var(--panel-border);
    border-radius: 8px;
    padding: 14px 22px;
    font-size: 12.5px;
  }
  #dropHint.dragover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #pageWrap {
    display: none;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    background: white;
    height: fit-content;
  }
  #pageWrap.visible { display: block; }
  #pdfCanvas { display: block; }

  #loadingBar {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    z-index: 20;
  }
  #loadingBar.active { display: block; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep {
    0% { transform: translateX(-100%) scaleX(0.4); }
    50% { transform: translateX(20%) scaleX(0.6); }
    100% { transform: translateX(100%) scaleX(0.4); }
  }

  #errorBanner {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #2c1d1a;
    border: 1px solid var(--danger);
    color: #f0c9c1;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    z-index: 30;
  }

  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--canvas-bg); }
  ::-webkit-scrollbar-thumb { background: #333437; border-radius: 6px; border: 3px solid var(--canvas-bg); }

  kbd {
    background: #17181a;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11.5px;
    color: var(--ink-dim);
  }
</style>
</head>
<body>

<div id="loadingBar"></div>

<header>
  <div class="brand"><b>PDF</b> ビューアー</div>

  <label class="file-picker">
    <input type="file" id="fileInput" accept="application/pdf">
    <span class="btn primary" id="openBtn">別のPDFを開く</span>
  </label>

  <div class="divider"></div>

  <div class="nav-group">
    <button class="btn" id="prevBtn" disabled title="前のページ">‹ 前へ</button>
    <input type="text" class="page-input" id="pageInput" value="0" disabled>
    <span class="page-total" id="pageTotal">/ 0</span>
    <button class="btn" id="nextBtn" disabled title="次のページ">次へ ›</button>
  </div>

  <div class="divider"></div>

  <div class="zoom-group">
    <button class="btn" id="zoomOutBtn" disabled title="縮小">－</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="btn" id="zoomInBtn" disabled title="拡大">＋</button>
    <button class="btn" id="fitBtn" disabled title="幅に合わせる">幅に合わせる</button>
  </div>

  <div class="spacer"></div>
  <div class="filename" id="filenameLabel"></div>
</header>

<main id="mainArea">
  <div id="emptyState">
    <div class="icon">📄</div>
    <h2>PDFを読み込めませんでした</h2>
    <p>同じフォルダに <b>document.pdf</b> が見つからないか、読み込みに失敗しました。<br>上の「別のPDFを開く」から選び直すか、ドラッグ&ドロップしてください。</p>
    <div id="dropHint">ここにPDFをドラッグ&ドロップすることもできます</div>
  </div>

  <div id="pageWrap">
    <canvas id="pdfCanvas"></canvas>
  </div>
</main>

<div id="errorBanner"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const fileInput = document.getElementById('fileInput');
  const openBtn = document.getElementById('openBtn');
  const emptyState = document.getElementById('emptyState');
  const pageWrap = document.getElementById('pageWrap');
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const mainArea = document.getElementById('mainArea');
  const dropHint = document.getElementById('dropHint');

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInput = document.getElementById('pageInput');
  const pageTotal = document.getElementById('pageTotal');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const fitBtn = document.getElementById('fitBtn');
  const zoomLabel = document.getElementById('zoomLabel');
  const filenameLabel = document.getElementById('filenameLabel');
  const loadingBar = document.getElementById('loadingBar');
  const errorBanner = document.getElementById('errorBanner');

  let pdfDoc = null;
  let currentPage = 1;
  let scale = 1.2;
  let renderTask = null;

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => errorBanner.style.display = 'none', 4000);
  }

  function setControlsEnabled(enabled) {
    [prevBtn, nextBtn, pageInput, zoomInBtn, zoomOutBtn, fitBtn].forEach(el => el.disabled = !enabled);
  }

  async function loadFile(file) {
    if (!file || file.type !== 'application/pdf') {
      showError('PDFファイルを選択してください');
      return;
    }
    loadingBar.classList.add('active');
    filenameLabel.textContent = file.name;
    try {
      const arrayBuffer = await file.arrayBuffer();
      await loadFromSource({ data: arrayBuffer });
    } catch (err) {
      console.error(err);
      showError('PDFの読み込みに失敗しました');
      filenameLabel.textContent = '';
    } finally {
      loadingBar.classList.remove('active');
    }
  }

  // URL（同じフォルダ内の固定PDFなど）から読み込む場合に使用
  async function loadFromUrl(url, label) {
    loadingBar.classList.add('active');
    if (label) filenameLabel.textContent = label;
    try {
      await loadFromSource({ url });
    } catch (err) {
      console.error(err);
      showError('PDFの読み込みに失敗しました（' + url + '）');
    } finally {
      loadingBar.classList.remove('active');
    }
  }

  async function loadFromSource(src) {
    const loadingTask = pdfjsLib.getDocument(src);
    pdfDoc = await loadingTask.promise;
    currentPage = 1;
    scale = 1.2;
    pageTotal.textContent = '/ ' + pdfDoc.numPages;
    emptyState.style.display = 'none';
    pageWrap.classList.add('visible');
    setControlsEnabled(true);
    await renderPage(currentPage);
  }

  // ページを開いたときに、固定PDFを自動で読み込む
  // 1) 同じフォルダの document.pdf を既定値とする
  // 2) URLに ?pdf=ファイル名 や ?pdf=https://... が付いていればそちらを優先
  (function autoLoad() {
    const params = new URLSearchParams(window.location.search);
    const target = params.get('pdf') || 'document.pdf';
    loadFromUrl(target, target.split('/').pop());
  })();

  async function renderPage(num) {
    if (!pdfDoc) return;
    if (renderTask) { try { renderTask.cancel(); } catch (e) {} }

    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    renderTask = page.render({ canvasContext: ctx, viewport });
    try {
      await renderTask.promise;
    } catch (err) {
      if (err && err.name !== 'RenderingCancelledException') console.error(err);
    }

    pageInput.value = num;
    zoomLabel.textContent = Math.round(scale / 1.2 * 100) + '%';
  }

  function goToPage(num) {
    if (!pdfDoc) return;
    num = Math.min(Math.max(1, num), pdfDoc.numPages);
    currentPage = num;
    renderPage(currentPage);
  }

  function fitToWidth() {
    if (!pdfDoc) return;
    pdfDoc.getPage(currentPage).then(page => {
      const unscaled = page.getViewport({ scale: 1 });
      const available = mainArea.clientWidth - 64;
      scale = (available / unscaled.width) * 1.2 / 1.2; // keep relative unit consistent
      scale = available / unscaled.width;
      renderPage(currentPage);
    });
  }

  openBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
  pageInput.addEventListener('change', () => goToPage(parseInt(pageInput.value, 10) || 1));

  zoomInBtn.addEventListener('click', () => { scale = Math.min(scale + 0.2, 4); renderPage(currentPage); });
  zoomOutBtn.addEventListener('click', () => { scale = Math.max(scale - 0.2, 0.3); renderPage(currentPage); });
  fitBtn.addEventListener('click', fitToWidth);

  document.addEventListener('keydown', e => {
    if (!pdfDoc) return;
    if (e.key === 'ArrowRight') goToPage(currentPage + 1);
    if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    if (e.key === '+' || e.key === '=') { scale = Math.min(scale + 0.2, 4); renderPage(currentPage); }
    if (e.key === '-') { scale = Math.max(scale - 0.2, 0.3); renderPage(currentPage); }
  });

  ['dragover', 'dragenter'].forEach(evt => {
    mainArea.addEventListener(evt, e => {
      e.preventDefault();
      dropHint.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    mainArea.addEventListener(evt, e => {
      e.preventDefault();
      dropHint.classList.remove('dragover');
    });
  });
  mainArea.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
</script>

</body>
</html>
